name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test-public.db
      DINGTALK_LOGIN_ENABLED: "false"
      LOCAL_USER_ID: "0"
      PREVIEW_SAFE_MODE: "false"
      SF_MOCK_MODE: "false"
      DB_MOCK_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_public_repo.py
      - run: python -m pytest -q
