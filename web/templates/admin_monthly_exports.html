{% extends "base.html" %}
{% block title %}快递费用分摊{% endblock %}
{% block page_class %}billing-allocation-page{% endblock %}
{% block head %}
<style>
.page.billing-allocation-page{width:100%;max-width:calc(100vw - 48px);padding:22px 0 44px;overflow-x:hidden}.ba-shell{width:100%;min-width:0}.ba-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.ba-head h1{font-size:28px;margin:0}.ba-head .ba-btn{display:inline-flex;align-items:center;text-decoration:none}.ba-panel{min-width:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.04)}.ba-toolbar{display:grid;grid-template-columns:180px 180px 170px minmax(20px,1fr) auto;gap:10px;align-items:end}.ba-field{display:flex;flex-direction:column;gap:5px;min-width:0}.ba-field label{font-size:12px;font-weight:700;color:#334155}.ba-field select,.ba-field input{width:100%;min-width:0;height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;background:#fff;font-size:13px}.ba-save{grid-column:5}.ba-upload-row{margin-top:10px}.ba-drop{height:62px;border:1.5px dashed #94a3b8;border-radius:9px;background:#f8fafc;display:flex;align-items:center;justify-content:center;text-align:center;color:#475569;font-size:13px;cursor:pointer;padding:0 16px;transition:.15s}.ba-drop:hover,.ba-drop.dragging{border-color:#1677ff;background:#eff6ff;color:#1d4ed8}.ba-drop.disabled{cursor:not-allowed;opacity:.55}.ba-drop strong{color:#1677ff}.ba-btn{height:38px;border:0;border-radius:8px;padding:0 15px;background:#1677ff;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}.ba-btn.green{background:#059669}.ba-btn.secondary{background:#e2e8f0;color:#334155}.ba-btn:disabled{opacity:.5;cursor:not-allowed}.ba-message{padding:9px 12px;border-radius:8px;margin:0 0 10px;background:#ecfdf5;color:#047857;font-size:13px}.ba-message.error{background:#fef2f2;color:#b91c1c}.hidden{display:none!important}.ba-table-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.ba-search{display:flex;align-items:center;gap:7px;min-width:0}.ba-search input{height:38px;width:min(440px,42vw);border:1px solid #cbd5e1;border-radius:8px;padding:0 11px}.ba-count{font-size:13px;color:#64748b;white-space:nowrap}.statement-list{display:grid;gap:5px;margin-bottom:8px}.statement-row{display:flex;align-items:center;gap:10px;min-width:0;padding:7px 9px;background:#f8fafc;border-radius:7px;font-size:12px}.statement-row.warn{background:#fff1f2}.statement-name{font-weight:750;white-space:nowrap}.statement-file{color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.statement-alert{color:#dc2626;white-space:nowrap}.statement-actions{display:flex;gap:6px;flex-wrap:wrap}.statement-actions a,.statement-actions button{border-radius:7px;padding:6px 9px;font-size:12px;text-decoration:none;cursor:pointer;font-weight:700}.statement-actions a{border:1px solid #1677ff;background:#1677ff;color:#fff}.statement-actions button{border:1px solid #cbd5e1;background:#fff;color:#475569}.ba-table-wrap{width:100%;height:clamp(360px,58vh,620px);overflow:auto;border:1px solid #dbe2ea;border-radius:9px}.ba-table{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content}.ba-table th{position:sticky;top:0;z-index:4;background:#f8fafc;padding:9px 10px;border-right:1px solid #e2e8f0;border-bottom:1px solid #dbe2ea;text-align:left;color:#475569;font-size:12px;white-space:nowrap;min-width:120px}.ba-table th.allocation-col{background:#eef6ff}.ba-table th.allocation-type-col{width:190px;min-width:190px}.ba-table th.allocation-dept-col{width:250px;min-width:250px}.ba-table th.allocation-project-col{width:280px;min-width:280px}.ba-table td{padding:8px 10px;border-right:1px solid #eef2f7;border-bottom:1px solid #eef2f7;font-size:12px;vertical-align:top;max-width:280px;white-space:normal;overflow-wrap:anywhere}.ba-table td.allocation-type-cell{width:190px;max-width:190px}.ba-table td.allocation-picker-cell{width:250px;max-width:280px}.ba-table tr.unresolved td{background:#fff7f7}.ba-table tr.unresolved td:first-child{box-shadow:inset 4px 0 #ef4444}.ba-table select,.ba-table input{width:100%;min-width:150px;height:33px;border:1px solid #cbd5e1;border-radius:7px;padding:0 7px;background:#fff;font-size:12px}.ba-table input[readonly],.ba-table input:disabled{background:#f8fafc}.ba-picker-field{position:relative;min-width:220px}.ba-picker-field input{height:54px;padding:6px 9px;color:transparent;caret-color:transparent}.ba-picker-field input::placeholder{color:transparent}.ba-picker-field input:focus{color:#0f172a;caret-color:auto}.ba-picker-field input:focus::placeholder{color:#94a3b8}.ba-picker-field input:focus+.ba-picker-display{display:none}.ba-picker-display{position:absolute;inset:1px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;pointer-events:none;overflow:hidden;color:#0f172a}.ba-picker-display b{font-size:12px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}.ba-picker-display small{font-size:11px;line-height:1.2;color:#64748b;white-space:normal;overflow-wrap:anywhere}.ba-picker-field.missing input{border-color:#ef4444;background:#fff1f2}.ba-picker-field.missing .ba-picker-display b,.ba-picker-field.missing .ba-picker-display small{color:#b91c1c}.ba-issue{display:block;margin-top:4px;color:#dc2626;font-size:11px;max-width:190px;line-height:1.35}.ba-empty{text-align:center;color:#94a3b8;padding:40px!important}.ba-pagination{display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:8px;color:#64748b;font-size:12px}.ba-pagination .ba-btn{height:32px;padding:0 11px}@media(max-width:900px){.ba-toolbar{grid-template-columns:repeat(3,minmax(0,1fr)) auto}.ba-save{grid-column:4}.ba-upload-row{grid-column:1/-1}}@media(max-width:650px){.page.billing-allocation-page{max-width:100%;padding:16px 12px 32px}.ba-toolbar{grid-template-columns:1fr}.ba-save{grid-column:1}.ba-table-head{align-items:stretch;flex-direction:column}.ba-search input{width:100%}}
</style>
<style>
.ba-table-actions{display:flex;align-items:center;gap:10px}.ba-table-actions .ba-btn{height:34px}.ba-table th.operation-col{right:0;z-index:6;min-width:138px;background:#f8fafc}.ba-table td.operation-cell{position:sticky;right:0;z-index:2;min-width:138px;max-width:138px;background:#fff}.ba-table tr.unresolved td.operation-cell{background:#fff7f7}.ba-row-actions{display:flex;gap:5px;flex-wrap:wrap}.ba-row-actions button{height:30px;border:1px solid #cbd5e1;border-radius:6px;padding:0 9px;background:#fff;color:#334155;font-size:11px;font-weight:700;cursor:pointer}.ba-row-actions button.primary{border-color:#1677ff;background:#1677ff;color:#fff}.ba-row-actions button.danger{border-color:#fecaca;color:#b91c1c}.ba-raw-input{display:block;width:100%;min-width:120px;min-height:54px;resize:vertical;border:1px solid #cbd5e1;border-radius:7px;padding:7px;background:#fff;font:inherit;line-height:1.35}.ba-table tr.readonly-row td{vertical-align:middle}.ba-table tr.readonly-row .ba-picker-field input{cursor:default}.ba-table td.raw-readonly{min-width:120px;line-height:1.45;white-space:normal;overflow-wrap:anywhere}
.ba-picker-field.editing .ba-picker-display{display:none}.ba-picker-field.editing input,.ba-picker-field.editing input:disabled{color:#0f172a;caret-color:auto}.ba-picker-field.editing input::placeholder{color:#94a3b8}.ba-table th.submitter-col,.ba-table td.submitter-cell{width:160px;min-width:160px;max-width:190px}.ba-picker-field.employee-picker{min-width:140px}.ba-picker-field.employee-picker .ba-picker-display small{display:none}
</style>
{% endblock %}
{% block content %}
<section class="ba-shell">
  <div class="ba-head"><h1>快递费用分摊</h1><a id="ba-visualization" class="ba-btn" href="/admin/billing-visualization">费用可视化</a></div>
  <section class="ba-panel">
    <div class="ba-toolbar">
      <div class="ba-field"><label>账单月份</label><input id="ba-month" type="month" value="{{ selected_month }}"></div>
      <div class="ba-field"><label>区域</label><select id="ba-region"><option value="all">全部区域</option>{% for code,name in region_names.items() %}<option value="{{ code }}" {% if code == selected_region %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
      <div class="ba-field"><label>快递方</label><select id="ba-courier"><option value="all" {% if selected_courier == 'ALL' %}selected{% endif %}>全部快递</option>{% for code,name in carriers.items() %}<option value="{{ code }}" {% if selected_courier == code %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
      <button class="ba-btn green ba-save" id="ba-save-all" type="button" disabled>保存修改</button>
    </div>
    <div class="ba-upload-row"><label id="ba-drop" class="ba-drop" for="ba-file"><input id="ba-file" class="hidden" type="file" accept=".xlsx"><span id="ba-drop-text"><strong>点击上传账单</strong>或将月结费用账单拖到这里，选择后自动匹配</span></label></div>
  </section>
  <div id="ba-message" class="ba-message hidden"></div>
  <section class="ba-panel">
    <div class="ba-table-head"><div class="ba-search"><input id="ba-query" placeholder="搜索运单号、下单员工、部门或项目"><button class="ba-btn secondary" id="ba-search" type="button">查询</button></div><div class="ba-table-actions"><span id="ba-count" class="ba-count">共 0 行</span><button class="ba-btn secondary" id="ba-add" type="button">新增条目</button></div></div>
    <div id="ba-statements" class="statement-list"></div>
    <div class="ba-table-wrap"><table class="ba-table"><thead id="ba-thead"></thead><tbody id="ba-body"><tr><td class="ba-empty">正在读取…</td></tr></tbody></table></div>
    <div class="ba-pagination"><button class="ba-btn secondary" id="ba-prev" type="button">上一页</button><span id="ba-page">第 1 页</span><button class="ba-btn secondary" id="ba-next" type="button">下一页</button></div>
  </section>
  <datalist id="ba-employees"></datalist><datalist id="ba-departments"></datalist><datalist id="ba-projects"></datalist>
</section>
<script>
(()=>{
const $=id=>document.getElementById(id),state={users:[],departments:[],projects:[],items:[],statements:[],rawColumns:[],waybillHeaders:[],page:1,pageSize:100,total:0,file:null,uploading:false,dirty:new Map(),editing:new Set(),newRows:new Set()};
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function show(text,error=false){const el=$('ba-message');el.textContent=text;el.classList.remove('hidden');el.classList.toggle('error',error);}
async function json(url,options){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw new Error(data.detail||'操作失败');return data;}
function projectDateKey(item){const match=String(item.project_code||'').match(/^(\d{8})/);return match?match[1]:'00000000';}
async function loadReferences(){const [departments,projects,users]=await Promise.all([json('/api/departments'),json('/api/projects'),json('/api/admin/users')]);state.departments=departments.items||[];state.projects=(projects.items||[]).sort((a,b)=>projectDateKey(b).localeCompare(projectDateKey(a))||String(b.project_code||'').localeCompare(String(a.project_code||''),'zh-CN'));state.users=(users.items||[]).filter(x=>x.is_active);$('ba-employees').innerHTML=state.users.map(x=>`<option value="${esc(x.name)}"></option>`).join('');$('ba-departments').innerHTML=state.departments.map(x=>`<option value="${esc(x.dept_name)} [${esc(x.dept_code)}]"></option>`).join('');$('ba-projects').innerHTML=state.projects.map(x=>`<option value="${esc(x.project_name)} [${esc(x.project_code)}]"></option>`).join('');}
function concreteScope(){return $('ba-region').value!=='all'&&$('ba-courier').value!=='all';}
function updateVisualizationLink(){$('ba-visualization').href='/admin/billing-visualization?'+new URLSearchParams({start_month:$('ba-month').value,end_month:$('ba-month').value,region:$('ba-region').value,courier_type:$('ba-courier').value});}
function syncUpload(){const enabled=concreteScope()&&!state.uploading;$('ba-file').disabled=!enabled;$('ba-drop').classList.toggle('disabled',!enabled);updateVisualizationLink();}
function params(){return new URLSearchParams({month:$('ba-month').value,region:$('ba-region').value,courier_type:$('ba-courier').value,query:$('ba-query').value,page:state.page,page_size:state.pageSize});}
async function load(){syncUpload();try{const data=await json('/api/admin/billing-allocations/workbench?'+params());state.items=data.items||[];state.statements=data.statements||[];state.rawColumns=data.raw_columns||[];state.waybillHeaders=data.waybill_headers||[];state.total=data.total||0;state.dirty.clear();state.editing.clear();state.newRows.clear();syncSaveButton();renderStatements();renderTable();}catch(error){show(error.message,true);}}
function exportClick(event,statement){if(statement.unmatched_rows&&!confirm(`该账单仍有 ${statement.unmatched_rows} 行未完成分摊，仍要导出吗？`))event.preventDefault();}
function renderStatements(){const root=$('ba-statements');root.innerHTML=state.statements.map(s=>`<div class="statement-row ${s.unmatched_rows?'warn':''}"><span class="statement-name">${esc(s.region_name)} · ${esc(s.carrier_name)}</span><span class="statement-file">${esc(s.source_filename)}</span>${s.unmatched_rows?`<span class="statement-alert">${s.unmatched_rows} 行待补充</span>`:'<span>已全部匹配</span>'}<span class="statement-actions"><a data-export data-id="${s.statement_id}" href="/api/admin/billing-allocations/${s.month}/${s.region_code}/${s.courier_type}/department">部门分摊</a><a data-export data-id="${s.statement_id}" href="/api/admin/billing-allocations/${s.month}/${s.region_code}/${s.courier_type}/project">项目分摊</a><a data-export data-id="${s.statement_id}" href="/api/admin/billing-allocations/${s.month}/${s.region_code}/${s.courier_type}/detail">分摊明细</a><button data-rematch="${s.statement_id}">重新匹配</button></span></div>`).join('');root.querySelectorAll('[data-export]').forEach(link=>{const statement=state.statements.find(x=>x.statement_id===Number(link.dataset.id));link.onclick=event=>exportClick(event,statement);});root.querySelectorAll('[data-rematch]').forEach(btn=>btn.onclick=()=>rematch(Number(btn.dataset.rematch)));}
function tableSchema(){let waybill=state.waybillHeaders.find(header=>state.rawColumns.includes(header))||state.rawColumns[0]||'运单号';const raw=state.rawColumns.filter(header=>header===waybill||!state.waybillHeaders.includes(header));if(!raw.includes(waybill))raw.unshift(waybill);return {raw,waybill};}
function renderHead(schema){const cells=[];schema.raw.forEach(header=>{cells.push(`<th>${esc(header)}</th>`);if(header===schema.waybill)cells.push('<th class="allocation-col submitter-col">下单员工</th><th class="allocation-col allocation-type-col">分摊方式</th><th class="allocation-col allocation-dept-col">归属部门</th><th class="allocation-col allocation-project-col">归属项目</th>');});cells.push('<th class="operation-col">操作</th>');$('ba-thead').innerHTML='<tr>'+cells.join('')+'</tr>';}
function displayValue(item,header,schema){if(header===schema.waybill)return item.waybill_no;const value=(item.raw_data||{})[header];return value===null||value===undefined?'':value;}
function pickerField(kind,item,value,name,code,{disabled=false,missing=false,interactive=false}={}){const employee=kind==='employee',label=employee?'下单员工':(kind==='dept'?'归属部门':'归属项目'),empty=missing?(employee?'请选择钉钉实名员工':'CRM 未配置执行部门'):`选择${label}`,list=employee?'employees':(kind==='dept'?'departments':'projects');return `<div class="ba-picker-field ${employee?'employee-picker':''} ${missing?'missing':''} ${interactive?'editing':''}"><input data-${kind}="${item.id}" list="ba-${list}" value="${esc(value)}" ${disabled?'disabled':''} placeholder="${esc(empty)}" title="${esc(value||empty)}"><span class="ba-picker-display" data-${kind}-display="${item.id}"><b>${esc(name||empty)}</b><small>${employee?'':esc(code||'点击选择')}</small></span></div>`;}
function rowComplete(item){return Boolean(item.submitter_user_id)&&((item.allocation_type==='department'&&item.dept_code)||(item.allocation_type==='project'&&item.dept_code&&item.project_code));}
function rowEditable(item){const key=String(item.id);return state.editing.has(key)||state.newRows.has(key)||!rowComplete(item);}
function allocationCells(item,editable){const type=item.project_code?'project':(item.allocation_type||'department'),project=type==='project',projectRef=project?state.projects.find(row=>String(row.project_code)===String(item.project_code)):null,missingProjectDept=project&&!item.dept_code&&(!projectRef||!String(projectRef.dept_code||'').trim()),employee=state.users.find(row=>Number(row.id)===Number(item.submitter_user_id)),employeeValue=employee?employee.name:(item.submitter_name||''),deptValue=item.dept_code?`${item.dept_name||''} [${item.dept_code}]`:'',projectValue=item.project_code?`${item.project_name||''} [${item.project_code}]`:'';return `<td class="submitter-cell">${pickerField('employee',item,employeeValue,item.submitter_name,'',{disabled:!editable,missing:!item.submitter_user_id,interactive:editable})}</td><td class="allocation-type-cell"><select data-type="${item.id}" ${editable?'':'disabled'}><option value="department" ${type==='department'?'selected':''}>部门分摊</option><option value="project" ${type==='project'?'selected':''}>项目分摊</option></select>${item.issue?`<small class="ba-issue">${esc(item.issue)}</small>`:''}</td><td class="allocation-picker-cell">${pickerField('dept',item,deptValue,item.dept_name,item.dept_code,{disabled:!editable,missing:missingProjectDept,interactive:editable})}</td><td class="allocation-picker-cell">${pickerField('project',item,projectValue,item.project_name,item.project_code,{disabled:!editable||!project,interactive:editable})}</td>`;}
function rawCell(item,header,schema,editable){const value=displayValue(item,header,schema);return editable?`<td><textarea class="ba-raw-input" data-raw-row="${item.id}" data-header="${esc(header)}">${esc(value)}</textarea></td>`:`<td class="raw-readonly">${esc(value)}</td>`;}
function actionCell(item,editable){const key=String(item.id),fresh=state.newRows.has(key),matched=rowComplete(item);if(editable)return `<td class="operation-cell"><div class="ba-row-actions"><button class="primary" data-save-row="${item.id}">保存</button>${matched||fresh?`<button data-cancel-row="${item.id}">取消</button>`:''}<button class="danger" data-delete-row="${item.id}">删除</button></div></td>`;return `<td class="operation-cell"><div class="ba-row-actions"><button class="primary" data-edit-row="${item.id}">编辑</button><button class="danger" data-delete-row="${item.id}">删除</button></div></td>`;}
function renderTable(){const schema=tableSchema();renderHead(schema);$('ba-count').textContent=`共 ${state.total+state.newRows.size} 行`;$('ba-page').textContent=`第 ${state.page} 页`;$('ba-prev').disabled=state.page<=1;$('ba-next').disabled=state.page*state.pageSize>=state.total;$('ba-add').disabled=state.statements.length!==1;const body=$('ba-body');if(!state.items.length){body.innerHTML=`<tr><td class="ba-empty" colspan="${schema.raw.length+5}">当前范围暂无费用账单明细</td></tr>`;wireRows();return;}body.innerHTML=state.items.map(item=>{const editable=rowEditable(item),rawEditable=state.newRows.has(String(item.id)),cells=[];schema.raw.forEach(header=>{cells.push(rawCell(item,header,schema,rawEditable));if(header===schema.waybill)cells.push(allocationCells(item,editable));});cells.push(actionCell(item,editable));return `<tr class="${item.issue||!rowComplete(item)?'unresolved':'readonly-row'}" data-row="${item.id}">${cells.join('')}</tr>`;}).join('');wireRows();}
function exactItem(type,value){const items=type==='employee'?state.users:(type==='project'?state.projects:state.departments),text=String(value||'').trim();return items.find(item=>{if(type==='employee')return text===String(item.id)||text===String(item.name||'').trim();const code=type==='project'?item.project_code:item.dept_code,name=type==='project'?item.project_name:item.dept_name;return text===String(code)||text===`${name} [${code}]`;});}
function updatePickerDisplay(kind,id,value){const type=kind==='employee'?'employee':(kind==='project'?'project':'department'),match=exactItem(type,value),display=document.querySelector(`[data-${kind}-display="${id}"]`),input=document.querySelector(`[data-${kind}="${id}"]`);if(!display||!input)return;const name=match?(type==='employee'?match.name:(type==='project'?match.project_name:match.dept_name)):String(value||'').replace(/\s*\[[^\]]*\]\s*$/,'');const code=match?(type==='employee'?'':(type==='project'?match.project_code:match.dept_code)):(String(value||'').match(/\[([^\]]*)\]\s*$/)||[])[1]||'';display.querySelector('b').textContent=name||(input.parentElement.classList.contains('missing')?(type==='employee'?'请选择钉钉实名员工':'CRM 未配置执行部门'):`选择${kind==='dept'?'归属部门':'归属项目'}`);display.querySelector('small').textContent=type==='employee'?'':(code||'点击选择');input.title=value||input.placeholder;}
function markDirty(id,source){const type=document.querySelector(`[data-type="${id}"]`).value,dept=document.querySelector(`[data-dept="${id}"]`),project=document.querySelector(`[data-project="${id}"]`),deptField=dept.parentElement;if(type==='project'){project.disabled=false;const matched=exactItem('project',project.value);if(matched&&(source==='project'||source==='type')){dept.value=matched.dept_code?`${matched.dept_name||''} [${matched.dept_code}]`:'';}deptField.classList.toggle('missing',Boolean(matched&&!exactItem('department',dept.value)));}else{project.disabled=true;deptField.classList.remove('missing');project.value='';}updatePickerDisplay('dept',id,dept.value);updatePickerDisplay('project',id,project.value);state.dirty.set(String(id),true);syncSaveButton();}
function wireRows(){document.querySelectorAll('[data-type]').forEach(el=>el.onchange=()=>markDirty(el.dataset.type,'type'));document.querySelectorAll('[data-employee]').forEach(el=>el.oninput=()=>{updatePickerDisplay('employee',el.dataset.employee,el.value);state.dirty.set(String(el.dataset.employee),true);syncSaveButton();});document.querySelectorAll('[data-dept]').forEach(el=>el.oninput=()=>{updatePickerDisplay('dept',el.dataset.dept,el.value);markDirty(el.dataset.dept,'dept');});document.querySelectorAll('[data-project]').forEach(el=>el.oninput=()=>{updatePickerDisplay('project',el.dataset.project,el.value);markDirty(el.dataset.project,'project');});document.querySelectorAll('[data-raw-row]').forEach(el=>el.oninput=()=>{state.dirty.set(String(el.dataset.rawRow),true);syncSaveButton();});document.querySelectorAll('[data-edit-row]').forEach(el=>el.onclick=()=>{state.editing.add(String(el.dataset.editRow));renderTable();});document.querySelectorAll('[data-cancel-row]').forEach(el=>el.onclick=()=>cancelRow(el.dataset.cancelRow));document.querySelectorAll('[data-delete-row]').forEach(el=>el.onclick=()=>deleteRow(el.dataset.deleteRow));document.querySelectorAll('[data-save-row]').forEach(el=>el.onclick=()=>saveRow(el.dataset.saveRow));}
function syncSaveButton(){const count=state.dirty.size;$('ba-save-all').disabled=!count;$('ba-save-all').textContent=count?`保存修改（${count}）`:'保存修改';}
function rowPayload(id){const type=document.querySelector(`[data-type="${id}"]`).value,employee=exactItem('employee',document.querySelector(`[data-employee="${id}"]`).value),dept=exactItem('department',document.querySelector(`[data-dept="${id}"]`).value),project=exactItem('project',document.querySelector(`[data-project="${id}"]`).value),item=state.items.find(row=>String(row.id)===String(id)),raw={...(item&&item.raw_data||{})};document.querySelectorAll(`[data-raw-row="${id}"]`).forEach(el=>raw[el.dataset.header]=el.value);if(!employee)throw new Error('请从钉钉实名员工搜索结果中选择下单员工');if(type==='department'&&!dept)throw new Error('请从 CRM 搜索结果中选择有效部门');if(type==='project'&&!project)throw new Error('请从 CRM 搜索结果中选择有效项目');if(type==='project'&&!dept)throw new Error('项目分摊必须选择有效部门');return {raw_data:raw,submitter_user_id:employee.id,allocation_type:type,dept_code:dept.dept_code,project_code:type==='project'?project.project_code:null};}
async function persistRow(id){const payload=rowPayload(id),fresh=state.newRows.has(String(id)),statement=state.statements[0],url=fresh?`/api/admin/billing-allocations/statements/${statement.statement_id}/lines`:`/api/admin/billing-allocations/lines/${id}/details`,method=fresh?'POST':'PATCH';return json(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}
async function saveRow(id){try{await persistRow(id);show('该条明细已保存，导出文件和可视化数据已同步更新');await load();}catch(error){show(error.message,true);}}
async function saveAll(){if(!state.dirty.size)return;const ids=[...state.dirty.keys()];$('ba-save-all').disabled=true;try{for(let index=0;index<ids.length;index++){$('ba-save-all').textContent=`正在保存 ${index+1}/${ids.length}`;await persistRow(ids[index]);}show(`已保存 ${ids.length} 条修改，导出文件和可视化数据已同步更新`);await load();}catch(error){show(error.message,true);syncSaveButton();}}
function cancelRow(id){const key=String(id);if(state.newRows.has(key)){state.items=state.items.filter(item=>String(item.id)!==key);state.newRows.delete(key);}state.editing.delete(key);state.dirty.delete(key);syncSaveButton();renderTable();}
async function deleteRow(id){const key=String(id);if(!confirm('确定删除该条分摊明细吗？删除后导出文件和可视化数据也会同步变更。'))return;if(state.newRows.has(key)){cancelRow(key);return;}try{await json(`/api/admin/billing-allocations/lines/${id}`,{method:'DELETE'});show('该条明细已删除');await load();}catch(error){show(error.message,true);}}
function addRow(){if(state.statements.length!==1)return show('新增条目前请选择具体区域和快递方',true);const id=`new-${Date.now()}`,raw={};state.rawColumns.forEach(header=>raw[header]='');state.items.unshift({id,statement_id:state.statements[0].statement_id,raw_data:raw,waybill_no:'',submitter_user_id:null,submitter_name:null,allocation_type:null,dept_code:null,dept_name:null,project_code:null,project_name:null,issue:'新增记录，请填写并保存'});state.newRows.add(id);state.editing.add(id);state.dirty.set(id,true);syncSaveButton();renderTable();}
async function rematch(id){try{await json(`/api/admin/billing-allocations/${id}/rematch`,{method:'POST'});show('已按当月系统订单及补充运单重新匹配');await load();}catch(error){show(error.message,true);}}
function chooseFile(file){state.file=file||null;$('ba-drop-text').innerHTML=file?`正在上传并匹配：<strong>${esc(file.name)}</strong>`:'<strong>点击上传账单</strong>或将月结费用账单拖到这里，选择后自动匹配';}
async function upload(file){if(!file||state.uploading)return;if(!concreteScope())return show('上传前请选择具体区域和快递方',true);state.file=file;state.uploading=true;chooseFile(file);syncUpload();const form=new FormData();form.append('month',$('ba-month').value);form.append('region',$('ba-region').value);form.append('courier_type',$('ba-courier').value);form.append('file',file);try{const data=await json('/api/admin/billing-allocations/import',{method:'POST',body:form});show(`账单已保存并匹配 ${data.manifest.matched_rows}/${data.manifest.row_count} 行${data.manifest.unmatched_rows?'，红色行请补充分摊归属':''}`,Boolean(data.manifest.unmatched_rows));state.page=1;await load();}catch(error){show(error.message,true);}finally{state.uploading=false;state.file=null;$('ba-file').value='';chooseFile(null);syncUpload();}}
$('ba-file').onchange=event=>upload(event.target.files[0]);$('ba-drop').ondragover=event=>{event.preventDefault();if(concreteScope()&&!state.uploading)$('ba-drop').classList.add('dragging');};$('ba-drop').ondragleave=()=>$('ba-drop').classList.remove('dragging');$('ba-drop').ondrop=event=>{event.preventDefault();$('ba-drop').classList.remove('dragging');if(!concreteScope())return show('请先选择具体区域和快递方',true);const file=event.dataTransfer.files[0];if(file)upload(file);};$('ba-save-all').onclick=saveAll;$('ba-add').onclick=addRow;$('ba-search').onclick=()=>{state.page=1;load();};$('ba-query').addEventListener('keydown',event=>{if(event.key==='Enter'){state.page=1;load();}});$('ba-prev').onclick=()=>{state.page--;load();};$('ba-next').onclick=()=>{state.page++;load();};for(const id of ['ba-month','ba-region','ba-courier'])$(id).onchange=()=>{state.page=1;chooseFile(null);load();};syncUpload();loadReferences().then(load).catch(error=>show(error.message,true));
})();
</script>
