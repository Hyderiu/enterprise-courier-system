{% extends "base.html" %}
{% block title %}费用归属配置{% endblock %}
{% block page_class %}cost-page-shell admin-workspace{% endblock %}
{% block content %}
<style>
.page.cost-page-shell{width:100%;max-width:calc(100vw - 48px);padding:24px 0 48px;overflow-x:hidden}.cost-page{width:100%;min-width:0}.cost-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}.cost-title h1{margin:0;font-size:28px}.sync-btn{border:0;border-radius:9px;padding:10px 16px;color:#fff;font-weight:750;cursor:pointer;background:#1677ff;white-space:nowrap}.sync-btn:disabled{opacity:.55}.sync-state{display:none;margin:0 0 10px;padding:9px 12px;border-radius:8px;background:#eff6ff;color:#1d4ed8}.sync-state.visible{display:block}.sync-state.error{background:#fef2f2;color:#b91c1c}.reference-stack{display:grid;gap:12px;min-width:0}.reference-card{min-width:0;background:#fff;border:1px solid #dfe6ee;border-radius:12px;padding:14px;box-shadow:0 2px 10px rgba(15,23,42,.04)}.reference-head{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;align-items:center;gap:14px;margin-bottom:10px}.reference-head h2{margin:0;font-size:19px;white-space:nowrap}.reference-count{color:#475569;font-size:13px;white-space:nowrap}.reference-search{min-width:0;width:100%;height:38px;border:1px solid #cbd5e1;border-radius:8px;padding:0 12px;font-size:14px}.reference-search:focus{outline:2px solid rgba(22,119,255,.14);border-color:#1677ff}.reference-table-wrap{width:100%;max-width:100%;height:clamp(280px,36vh,380px);overflow-y:auto;overflow-x:hidden;border:1px solid #e2e8f0;border-radius:9px}.reference-table,.reference-table.project{width:100%;min-width:0;table-layout:fixed;border-collapse:separate;border-spacing:0}.reference-table th{position:sticky;top:0;z-index:2;background:#f8fafc;padding:10px 12px;text-align:left;color:#334155;border-bottom:1px solid #dfe6ee;white-space:normal;overflow-wrap:anywhere}.reference-table td{padding:10px 12px;border-bottom:1px solid #eef2f7;color:#475569;vertical-align:top;line-height:1.45;overflow-wrap:anywhere;word-break:break-word}.reference-table tbody tr:last-child td{border-bottom:0}.reference-table tbody tr:hover td{background:#f8fbff}.code-cell{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#1e293b!important;white-space:normal}.path-cell{overflow-wrap:anywhere}.missing-cell{color:#dc2626!important}.empty-row{text-align:center;color:#94a3b8!important;padding:40px!important}@media(max-width:700px){.page.cost-page-shell{max-width:100%;padding:16px 12px 32px}.cost-title h1{font-size:24px}.reference-card{padding:10px}.reference-head{grid-template-columns:1fr auto}.reference-head h2{grid-column:1}.reference-count{grid-column:2}.reference-search{grid-column:1 / -1}.reference-table-wrap{height:320px}.reference-table th,.reference-table td{padding:9px 8px;font-size:12px}}
</style>

<section class="cost-page">
  <div class="cost-title"><h1>💰 费用归属配置</h1><button id="crm-sync-button" class="sync-btn" type="button">↻ 同步 CRM</button></div>
  <div id="crm-sync-status" class="sync-state"></div>
  <div class="reference-stack">
    <section class="reference-card">
      <div class="reference-head"><h2>🏢 部门</h2><input id="department-search" class="reference-search" placeholder="搜索部门编码或完整路径"><span id="department-count" class="reference-count">共 0 条</span></div>
      <div class="reference-table-wrap"><table class="reference-table"><colgroup><col style="width:22%"><col style="width:78%"></colgroup><thead><tr><th>部门编码</th><th>部门完整路径</th></tr></thead><tbody id="department-body"><tr><td colspan="2" class="empty-row">正在读取…</td></tr></tbody></table></div>
    </section>
    <section class="reference-card">
      <div class="reference-head"><h2>📁 项目</h2><input id="project-search" class="reference-search" placeholder="搜索项目编号、名称、部门编码或完整路径"><span id="project-count" class="reference-count">共 0 条</span></div>
      <div class="reference-table-wrap"><table class="reference-table project"><colgroup><col style="width:18%"><col style="width:32%"><col style="width:18%"><col style="width:32%"></colgroup><thead><tr><th>项目编号</th><th>项目名称</th><th>执行部门编码</th><th>执行部门完整路径</th></tr></thead><tbody id="project-body"><tr><td colspan="4" class="empty-row">正在读取…</td></tr></tbody></table></div>
    </section>
  </div>
</section>

<script>
(()=>{
const state={departments:[],projects:[]},$=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function readJson(response){const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw new Error(data.detail||'读取失败');return data;}
function includes(value,keyword){return String(value||'').toLowerCase().includes(keyword);}
function renderDepartments(){const keyword=$('department-search').value.trim().toLowerCase(),items=state.departments.filter(item=>includes(item.dept_code,keyword)||includes(item.dept_name,keyword));$('department-count').textContent=`共 ${items.length} 条`;$('department-body').innerHTML=items.length?items.map(item=>`<tr><td class="code-cell">${esc(item.dept_code)}</td><td class="path-cell">${esc(item.dept_name)}</td></tr>`).join(''):'<tr><td colspan="2" class="empty-row">没有匹配部门</td></tr>';}
function renderProjects(){const keyword=$('project-search').value.trim().toLowerCase(),items=state.projects.filter(item=>includes(item.project_code,keyword)||includes(item.project_name,keyword)||includes(item.dept_code,keyword)||includes(item.dept_name,keyword));$('project-count').textContent=`共 ${items.length} 条`;$('project-body').innerHTML=items.length?items.map(item=>{const missing=!item.dept_code;return `<tr><td class="code-cell">${esc(item.project_code)}</td><td>${esc(item.project_name)}</td><td class="code-cell ${missing?'missing-cell':''}">${missing?'CRM 未配置':esc(item.dept_code)}</td><td class="path-cell ${missing?'missing-cell':''}">${missing?'CRM 未配置':esc(item.dept_name)}</td></tr>`;}).join(''):'<tr><td colspan="4" class="empty-row">没有匹配项目</td></tr>';}
async function loadReferenceData(){const [departments,projects]=await Promise.all([fetch('/api/departments').then(readJson),fetch('/api/projects').then(readJson)]);state.departments=departments.items||[];state.projects=(projects.items||[]).sort((a,b)=>Number(!a.dept_code)-Number(!b.dept_code)||String(b.project_code).localeCompare(String(a.project_code),'zh-CN'));renderDepartments();renderProjects();}
function showSync(text,error=false){const status=$('crm-sync-status');status.textContent=text;status.classList.add('visible');status.classList.toggle('error',error);}
async function syncFromCrm(){const button=$('crm-sync-button');button.disabled=true;button.textContent='正在同步…';showSync('正在同步 CRM 部门和项目…');try{const start=await fetch('/api/admin/reference/sync-crm',{method:'POST'}).then(readJson);const startedAt=Date.now();for(;;){if(Date.now()-startedAt>15*60*1000)throw new Error('同步超时，请稍后重试');await new Promise(resolve=>setTimeout(resolve,1200));const progress=await fetch('/api/admin/reference/sync-crm/status').then(readJson),current=progress.state||{};showSync(current.message||'正在同步…');if(current.status==='failed')throw new Error(current.message||'同步失败');if(current.status==='done'){await loadReferenceData();showSync('同步完成');setTimeout(()=>{$('crm-sync-status').classList.remove('visible');},1800);break;}}}catch(error){showSync(error.message,true);}finally{button.disabled=false;button.textContent='↻ 同步 CRM';}}
$('department-search').addEventListener('input',renderDepartments);$('project-search').addEventListener('input',renderProjects);$('crm-sync-button').addEventListener('click',syncFromCrm);loadReferenceData().catch(error=>showSync(error.message,true));
})();
</script>
{% endblock %}
