{% extends "base.html" %}
{% block title %}成员与权限{% endblock %}
{% block page_class %}admin-workspace{% endblock %}
{% block content %}
<section class="member-page">
  <div class="member-head">
    <h1>成员与权限</h1>
    <button id="sync-users" class="btn btn-primary" type="button">↻ 同步钉钉员工</button>
  </div>
  <div class="member-tools">
    <input id="member-search" type="search" placeholder="搜索姓名、手机号、部门">
    <select id="role-filter" data-searchable data-placeholder="输入权限">
      <option value="">全部成员</option><option value="user">普通员工</option><option value="admin">管理员</option>
    </select>
    <span id="member-count"></span>
  </div>
  <div id="member-message" class="member-message" hidden></div>
  <div class="member-table-wrap">
    <table class="member-table">
      <thead><tr><th>员工</th><th>部门</th><th>手机号</th><th>管理员权限</th><th>允许自定义寄件地址</th><th>账号状态</th></tr></thead>
      <tbody id="member-list"><tr><td colspan="6" class="empty">正在加载…</td></tr></tbody>
    </table>
  </div>
</section>

<style>
.member-page{max-width:1180px;margin:0 auto}.member-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}.member-head h1{margin:0;color:#172033}.member-tools{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px}.member-tools>input{min-width:280px}.member-tools>.search-select{width:190px}.member-tools span{margin-left:auto;color:#64748b;font-size:13px}.member-message{margin:12px 0;padding:11px 14px;border-radius:9px;background:#ecfdf5;color:#047857}.member-message.error{background:#fef2f2;color:#b91c1c}.member-table-wrap{margin-top:12px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:auto}.member-table{width:100%;border-collapse:collapse}.member-table th,.member-table td{text-align:left;padding:12px 14px;border-bottom:1px solid #eef2f7;vertical-align:middle}.member-table th{font-size:12px;color:#64748b;background:#f8fafc}.person{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e0e7ff;display:grid;place-items:center;color:#4338ca;font-weight:700}.person b{display:block}.person small{color:#94a3b8}.admin-role-label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}.admin-role-label input{width:17px;height:17px;accent-color:#1677ff}.status-btn{border:0;border-radius:999px;padding:7px 11px;cursor:pointer}.status-btn.active{background:#dcfce7;color:#166534}.status-btn.inactive{background:#fee2e2;color:#991b1b}.empty{text-align:center!important;color:#94a3b8;padding:35px!important}@media(max-width:720px){.member-head{align-items:flex-start;flex-direction:column}.member-tools{align-items:stretch;flex-direction:column}.member-tools>input,.member-tools>.search-select{min-width:0;width:100%}.member-tools span{margin-left:0}.member-table{min-width:760px}}
.member-tools span{white-space:nowrap}
.muted-permission{color:#64748b;font-size:13px;white-space:nowrap}
.member-page{width:100%;max-width:none;min-width:0}
</style>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const list=document.getElementById('member-list'), search=document.getElementById('member-search'), filter=document.getElementById('role-filter');
  const message=document.getElementById('member-message'), count=document.getElementById('member-count'), sync=document.getElementById('sync-users');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function show(text,error=false){message.textContent=text;message.hidden=false;message.classList.toggle('error',error);}
  async function request(url,options={}){const res=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.detail||'操作失败');return body;}
  function render(items){count.textContent=`共 ${items.length} 人`;if(!items.length){list.innerHTML='<tr><td colspan="6" class="empty">没有找到成员</td></tr>';return;}list.innerHTML=items.map(u=>`<tr data-id="${u.id}"><td><div class="person">${u.avatar?`<img class="avatar" src="${esc(u.avatar)}" alt="">`:`<span class="avatar">${esc((u.name||'?').slice(0,1))}</span>`}<span><b>${esc(u.name)}</b><small>${esc(u.dingtalk_userid||'')}</small></span></div></td><td>${esc(u.department)}</td><td>${esc(u.phone||'-')}</td><td><label class="admin-role-label"><input class="admin-role-toggle" type="checkbox" ${u.role==='admin'?'checked':''}><span>${u.role==='admin'?'已设为管理员':'设为管理员'}</span></label></td><td>${u.role==='admin'?'<span class="muted-permission">管理员默认允许</span>':`<label class="admin-role-label"><input class="custom-address-toggle" type="checkbox" ${u.allow_custom_sender_address?'checked':''}><span>${u.allow_custom_sender_address?'已允许':'未允许'}</span></label>`}</td><td><button class="status-btn ${u.is_active?'active':'inactive'}" data-active="${u.is_active}">${u.is_active?'已启用':'已停用'}</button></td></tr>`).join('');}
  async function load(){const params=new URLSearchParams({q:search.value.trim(),role:filter.value});try{const data=await request('/api/admin/users?'+params);render(data.items);}catch(e){show(e.message,true);}}
  let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250)});filter.addEventListener('change',load);
  list.addEventListener('change',async e=>{if(!e.target.matches('.admin-role-toggle'))return;const row=e.target.closest('tr'),next=e.target.checked?'admin':'user';e.target.disabled=true;try{await request(`/api/admin/users/${row.dataset.id}/role`,{method:'PATCH',body:JSON.stringify({role:next})});show('管理员权限已保存');await load();}catch(err){e.target.checked=!e.target.checked;e.target.disabled=false;show(err.message,true);}});
  list.addEventListener('change',async e=>{if(!e.target.matches('.custom-address-toggle'))return;const row=e.target.closest('tr'),next=e.target.checked;e.target.disabled=true;try{await request(`/api/admin/users/${row.dataset.id}/custom-sender-address`,{method:'PATCH',body:JSON.stringify({allowed:next})});show('自定义寄件地址权限已保存');await load();}catch(err){e.target.checked=!next;e.target.disabled=false;show(err.message,true);}});
  list.addEventListener('click',async e=>{if(!e.target.matches('.status-btn'))return;const row=e.target.closest('tr'),next=e.target.dataset.active!=='true';try{await request(`/api/admin/users/${row.dataset.id}/active`,{method:'PATCH',body:JSON.stringify({is_active:next})});show('账号状态已保存');load();}catch(err){show(err.message,true);}});
  sync.addEventListener('click',async()=>{
    sync.disabled=true;sync.textContent='正在启动同步…';
    try{
      await request('/api/admin/users/sync-dingtalk',{method:'POST'});
      const deadline=Date.now()+10*60*1000;
      while(Date.now()<deadline){
        const data=await request('/api/admin/users/sync-dingtalk/status');
        const state=data.state||{};
        sync.textContent=state.message||'正在同步…';
        if(state.status==='failed')throw new Error(state.message||'钉钉同步失败');
        if(state.status==='done'){
          const stats=state.stats||{};
          if(stats.users_sync_error)throw new Error('读取钉钉员工失败：'+stats.users_sync_error);
          const users=stats.users_synced||{};
          show(`同步完成：通讯录 ${users.total||0} 人，新增 ${users.created||0} 人，更新 ${users.updated||0} 人，未变化 ${users.unchanged||0} 人`);
          await load();
          return;
        }
        await new Promise(resolve=>setTimeout(resolve,1200));
      }
      throw new Error('同步等待超时，请稍后查看或重试');
    }catch(e){show(e.message,true);}
    finally{sync.disabled=false;sync.textContent='↻ 同步钉钉员工';}
  });
  load();
})();
</script>
{% endblock %}
